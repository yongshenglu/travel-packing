<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图标候选 — 行李清单</title>
<style>
  :root {
    --paper: #F4F7F5; --paper-2: #ECF1EE; --ink: #142220; --ink-2: #5C6F6B;
    --line: #D5DFDB; --accent: #0D9488;
    --font: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101917; --paper-2: #172422; --ink: #E7F0ED; --ink-2: #9BB0AB; --line: #273835;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    font-family: var(--font); background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 24px; line-height: 1.6; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--paper-2); text-align: center;
  }
  .card .imgs {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 18px 10px 12px;
  }
  .card img { border-radius: 22%; display: block; }
  .lg { width: 84px; height: 84px; }
  .sm { width: 29px; height: 29px; }
  .xs { width: 16px; height: 16px; }
  .card .meta { padding: 10px 12px 14px; border-top: 1px solid var(--line); }
  .name { font-size: 14px; font-weight: 650; }
  .desc { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
  .tag {
    display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
  }
  .note {
    margin-top: 28px; padding: 14px 16px; border-radius: 12px;
    background: var(--paper-2); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2); line-height: 1.7;
  }
  .note b { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>图标候选</h1>
  <p class="sub">同一套青绿底色，只换图形方向。每个方案同时给出主屏大图、主屏小图、浏览器标签页尺寸，方便判断缩小后还认不认得出来。</p>

  <div class="grid" id="grid"></div>

  <div class="note">
    <b>怎么选</b><br>
    说编号就行（比如「用 C」）。选定后我会把对应的 192 / 512 / maskable / apple-touch / favicon 一套都换掉，
    并更新 PWA 清单里的引用。<br><br>
    说明：这些是一次性生成的示意图，线条比例和留白还能再调；如果某个方案的方向对但细节不满意，也可以说，我改完再给你看。
  </div>
</div>

<script>
const items = [
  ['a-suitcase-check', '行李箱 + 勾',      '最直白：箱子正面一个大勾，强调「装好了」', '最易识别'],
  ['b-checklist',      '清单表',           '两行已勾、一行待办，直指「清单」这件事', '最贴题'],
  ['c-luggage-tag',    '吊牌 + 小箱',      '呼应应用里的吊牌小标，牌面嵌一个带勾的小箱子', '最有细节'],
  ['d-roller',         '拉杆箱',           '拉杆 + 轮子，轮廓最好认', '最易识别'],
  ['e-stacked',        '叠放的行李',       '两层箱子错落堆叠，层次感强', '最有层次'],
  ['f-parcel-check',   '包裹 + 勾',        '箱盖 + 胶带十字 + 勾，打包动作感', '最有动感'],
  ['g-pin-suitcase',   '行李箱 + 定位',    '箱子带定位针，强调「出行目的地」', '最有旅行感'],
  ['h-tag-check',      '吊牌 + 勾',        '极简吊牌，只留打孔和勾', '最简练'],
];

document.getElementById('grid').innerHTML = items.map(([file, name, desc, tag]) => `
  <div class="card">
    <div class="imgs">
      <img class="lg" src="${file}.png" alt="${name} 大">
      <img class="sm" src="${file}.png" alt="${name} 中">
      <img class="xs" src="${file}.png" alt="${name} 小">
    </div>
    <div class="meta">
      <div class="name">${name}</div>
      <div class="desc">${desc}</div>
      <span class="tag">${tag}</span>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
