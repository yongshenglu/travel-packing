<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7F5">
<meta name="app-version" content="tp-v47">
<meta name="description" content="手机端出游打包清单：必带/选带物品池、出行清单清点、模版复用，数据私有存储。">
<title>行李清单</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">

  <header class="topbar">
    <button class="icon-btn" id="btn-back" hidden aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="page-title" id="page-title">行李清单</div>
    <div class="topbar-right">
      <button class="tbtn" id="btn-new" hidden>＋ 新建</button>
      <button class="sync-chip" id="sync-chip" data-state="offline" aria-label="同步状态">
        <span class="dot"></span><span id="sync-text">仅本机</span>
      </button>
    </div>
  </header>

  <main class="main" id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="lists">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      <span>清单</span>
    </button>
    <button class="tab" data-tab="pools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V7a2 2 0 0 0-2-2h-6l-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><circle cx="17" cy="16" r="3"/></svg>
      <span>物品池</span>
    </button>
    <button class="tab" data-tab="templates">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="13" height="13" rx="2"/><path d="M16 21H6a2 2 0 0 1-2-2V8"/></svg>
      <span>模版</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <div class="sheet-root" id="sheet-root"></div>
  <div class="toast" id="toast"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
